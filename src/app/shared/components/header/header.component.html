<header class="cinema-header">
  <div class="cinema-container header-inner">
    <a routerLink="/event" class="brand " >
      <div class="brand-text">
              <img src="../../../../assets/images/logo.png" alt="الشعار" class="brand-logo" onerror="this.style.display='none'" />

        <span class="brand-name">الصارخ</span>
        
      </div>
    <p class="brand-description " >
مسرح الأنبا رويس – الكاتدرائية المرقسية بالعباسية
      </p>
    </a>
  

    <nav class="nav-links">
      @if (isAuthenticated()) {
       <!--  <a routerLink="/event" class="nav-link" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          <span>الفعاليات</span>
        </a> -->

        @if (isAdmin) {
          <a routerLink="/admin" class="nav-link" routerLinkActive="active">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2L2 7l10 5 10-5-10-5z"/>
              <path d="M2 17l10 5 10-5"/>
              <path d="M2 12l10 5 10-5"/>
            </svg>
            <span>لوحة التحكم</span>
          </a>
          <a routerLink="/admin/transfers" class="nav-link" routerLinkActive="active">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="1" x2="12" y2="23"/>
              <path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>
            </svg>
            <span>تحويل المشرف</span>
          </a>
        }

        @if (isSupervisor) {
          <a routerLink="/supervisor" class="nav-link" routerLinkActive="active">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
            </svg>
            <span>المشرف</span>
          </a>
        }

        <button type="button" class="nav-link btn-logout-link" (click)="logout()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          <span>خروج</span>
        </button>
      }
    </nav>
  </div>

  <!-- Cinema curtain bottom border -->
  <div class="header-curtain"></div>
</header>
