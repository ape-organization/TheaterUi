 <div class="modal-overlay user-info-overlay">
    <div class="modal-content user-info-modal">
      <div class="user-info-modal-header">
        <img src="assets/images/logo.png" alt="الشعار" class="modal-logo" onerror="this.style.display='none'" />
        <h2>مرحباً بك</h2>
        <p>يرجى إدخال بياناتك قبل حجز المقاعد</p>
      </div>

      <div class="user-info-modal-body">
        <div class="field-group">
          <label for="modalUserName">الاسم</label>
          <input
            id="modalUserName"
            type="text"
            class="cinema-input"
            [(ngModel)]="userName"
            placeholder="أدخل اسمك"
            required
          />
        </div>
        <div class="error-message" *ngIf="error">
          {{ errorMsg }}
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-primary" (click)="saveUserInfo()" style="width:100%">
          <svg width="18" height="18" 
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          متابعة
        </button>
      </div>
    </div>
  </div>
