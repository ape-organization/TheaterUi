<div class="theater">

    <!-- Legend -->
    <div class="legend">
        <div class="legend-item">
            <span class="legend-dot available"></span>
            <span>متاح</span>
        </div>
        <div class="legend-item">
            <span class="legend-dot selected"></span>
            <span>مختار</span>
        </div>
        <div class="legend-item">
            <span class="legend-dot reserved"></span>
            <span>محجوز</span>
        </div>
        <div class="legend-item">
            <span class="legend-dot premium"></span>
            <span>VIP</span>
        </div>
    </div>

    <!-- Scroll hint for narrow screens -->
    @if (isOverflowing && viewportWidth <= 1024) {
        <div class="scroll-hint">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"/>
            </svg>
            <span>اسحب لمشاهدة باقي المقاعد</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"/>
            </svg>
        </div>
    }

    <div class="layout-container"
         [class.is-scrollable]="isOverflowing"
         (touchstart)="onTouchStart($event)"
         (touchmove)="onTouchMove($event)"
         (touchend)="onTouchEnd($event)">
        <div class="layout" 
             [style.transform]="'scale(' + scale + ')'"
             [style.transform-origin]="'center top'">

            <div class="stage-wrapper">
                <app-stage />
            </div>

            @for(block of displayBlocks(); track block.id){

                <app-block
                    [block]="block"
                    [selectedSeatIds]="selectedSeatIds()"
                    [translateOffset]="translateOffset"
                    (seatClick)="toggleSeatSelection($event)">
                </app-block>

            }

        </div>
    </div>

    <!-- Selection Summary -->
    @if (selectedSeatCount() > 0) {
        <div class="selection-summary">
            <div class="summary-left">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                </svg>
                <div class="summary-text">
                    <span class="summary-count"><strong>{{ selectedSeatCount() }}</strong> مقاعد مختارة</span>
                </div>
            </div>
            <div class="summary-right">
                <span class="summary-total-label">الإجمالي</span>
                <span class="summary-total">{{ selectedSeatTotal() | currency:'EGP':'symbol':'1.0-0' }}</span>
            </div>
        </div>
    }

</div>
