<div class="supervisor-page">
  <div class="supervisor-container">
   
    <!-- Stats -->
    <app-supervisor-stats [transfers]="transfers()"
   
    ></app-supervisor-stats>
<div *ngIf="error()" class="error">
{{errorMsg()}}
</div>
    <!-- Transfers Table -->
    <app-supervisor-transfers-table
      [transfers]="transfers()"
      [isLoading]="isLoading"
      [updatingId]="updatingId"
      (confirm)="confirmTransfer($event)"
      >
    </app-supervisor-transfers-table>
  </div>
</div>
