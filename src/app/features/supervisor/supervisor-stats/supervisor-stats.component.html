<div class="stats-row">
  <div class="stat-card">
    <div class="stat-icon pending-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
    </div>
    <div class="stat-info">
      <span class="stat-value">{{ pendingCount }}</span>
      <span class="stat-label">قيد الانتظار</span>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-icon confirmed-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 11-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
    </div>
    <div class="stat-info">
      <span class="stat-value">{{ confirmedCount }}</span>
      <span class="stat-label">تم الاستلام</span>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-icon total-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="1" x2="12" y2="23"/>
        <path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>
      </svg>
    </div>
    <div class="stat-info">
      <span class="stat-value">EGP {{ totalAmount | number }}</span>
      <span class="stat-label">إجمالي المستلم</span>
    </div>
  </div>
   <div class="stat-card">
    <div class="stat-icon total-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="1" x2="12" y2="23"/>
        <path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>
      </svg>
    </div>
    <div class="stat-info">
      <span class="stat-value">EGP {{ balance | number }}</span>
      <span class="stat-label">الرصيد</span>
    </div>
  </div>
</div>
