<section class="auth-page">
  <div class="auth-bg-pattern"></div>

  <div class="auth-container">
    <!-- Branding -->
    <div class="auth-header">
      <h1 class="auth-title"> عرض الصارخ </h1>
      <p class="auth-subtitle">سجل الدخول لحجز مقاعدك</p>
    </div>

    <!-- Login Card -->
    <div class="auth-card">
      <div class="auth-card-header">
        <h2>مرحباً بك</h2>
        <p>أدخل معلومات الاتصال الخاصة بك</p>
      </div>

     

     

      <!-- Phone Form -->
      @if (activeTab() === 'phone') {
        <form [formGroup]="phoneForm" (ngSubmit)="submit()" class="auth-form">
          <div class="input-group">
            <label for="phone" class="input-label">رقم الهاتف</label>
            <div class="input-wrapper">
              <span class="input-prefix">2+</span>
              <input
                id="phone"
                type="tel"
                formControlName="phoneNumber"
                class="cinema-input"
                [class.error]="phoneForm.controls.phoneNumber.invalid && phoneForm.controls.phoneNumber.touched"
                placeholder="012 5206 8807"
                maxlength="11"
              />
            </div>
            @if (phoneForm.controls.phoneNumber.invalid && phoneForm.controls.phoneNumber.touched) {
              <span class="input-error">يرجى إدخال رقم هاتف صحيح (11 أرقام)</span>
            }
             @if (error()) {
              <span class="input-error">{{ errorMsg() }}</span>
            }
          </div>

          <button type="submit" class="btn-primary auth-submit" [disabled]="isLoading()">
            @if (isLoading()) {
              <app-loading-spinner></app-loading-spinner>
              <span>جاري الإرسال...</span>
            } @else {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 2L11 13"/>
                <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
              </svg>
              <span>إرسال رمز التحقق</span>
            }
          </button>
        </form>
      }
    </div>
  </div>
</section>
