<div class="card create-card">
  <h2>تحويل جديد</h2>
  <form >
    <div class="form-row">
      <div class="form-group">
        <label>المبلغ (EGP)</label>
        <input
          type="number"
          class="cinema-input"
          [(ngModel)]="transferData.amount"
          name="amount"
          required
          min="1"
          placeholder="أدخل المبلغ"
        />
      </div>
      
    </div>
   <div *ngIf="error">
{{errorMsg}}
   </div>
    <button type="submit" (click)="onSubmit()" class="btn-primary" [disabled]="isSubmitting">
      @if (isSubmitting) {
        جاري الإرسال...
      } @else {
        تحويل
      }
    </button>
  </form>

  <!-- Confirmation Dialog -->
  @if (showConfirm()) {
    <div class="confirm-overlay" (click)="onCancelTransfer()">
      <div class="confirm-dialog" (click)="$event.stopPropagation()">
        <div class="confirm-icon">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
        </div>
        <h3 class="confirm-title">تأكيد التحويل</h3>
        <p class="confirm-message">هل أنت متأكد من إرسال هذا التحويل بقيمة {{ transferData.amount }} ج.م؟</p>
        <div class="confirm-actions">
          <button class="btn-cancel" (click)="onCancelTransfer()">
            إلغاء
          </button>
          <button class="btn-confirm" (click)="onConfirmTransfer()">
            تأكيد
          </button>
        </div>
      </div>
    </div>
  }
</div>
