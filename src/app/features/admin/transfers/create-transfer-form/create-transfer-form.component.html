<div class="card create-card">
  <h2>تحويل جديد</h2>
  <form (ngSubmit)="onSubmit()">
    <div class="form-row">
      <div class="form-group">
        <label>المبلغ (EGP)</label>
        <input
          type="number"
          class="cinema-input"
          [(ngModel)]="transferData.amount"
          name="amount"
          required
          min="1"
          placeholder="أدخل المبلغ"
        />
      </div>
      <div class="form-group">
        <label>اسم المشرف</label>
        <input
          type="text"
          class="cinema-input"
          [(ngModel)]="transferData.toSupervisorName"
          name="supervisorName"
          required
          placeholder="اسم المشرف"
        />
      </div>
    </div>
    <div class="form-group">
      <label>ملاحظات</label>
      <textarea
        class="cinema-input"
        [(ngModel)]="transferData.notes"
        name="notes"
        rows="2"
        placeholder="ملاحظات إضافية (اختياري)"
      ></textarea>
    </div>
    <button type="submit" class="btn-primary" [disabled]="isSubmitting">
      @if (isSubmitting) {
        جاري الإرسال...
      } @else {
        تحويل
      }
    </button>
  </form>
</div>
